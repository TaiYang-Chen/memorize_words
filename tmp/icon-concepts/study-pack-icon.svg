  <!-- Reinsert the card above the body after the pack silhouette. -->
  <rect x="286" y="282" width="452" height="366" rx="62" fill="#FFFDF7"/>
  <rect x="362" y="384" width="202" height="42" rx="21" fill="#071A3A"/>
  <rect x="362" y="464" width="294" height="32" rx="16" fill="#C5D7D2"/>
